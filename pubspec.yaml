name: rafiq_barmaja
description: "تطبيق رفيق البرمجة - تعليم البرمجة بالعربية"
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter

    provider: ^6.0.5
    shared_preferences: ^2.2.3
    google_fonts: ^6.1.0

    flutter_localizations:
        sdk: flutter
    intl: ^0.19.1

    cupertino_icons: ^1.0.6

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.1

flutter:
    uses-material-design: true
    fonts:
      - family: Cairo
        fonts:
          - asset: assets/fonts/Cairo-Regular.ttf
          - asset: assets/fonts/Cairo-Bold.ttf
